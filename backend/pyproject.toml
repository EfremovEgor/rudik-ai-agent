[project]
name = "backend"
version = "0.1.0"
description = "Рудик — голосовой AI-ассистент Инженерной академии РУДН"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.17",
    "langchain-openai>=1.0.0",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.1",
    "selectolax>=0.3.27",
    "rank-bm25>=0.2.2",
    "numpy>=2.1.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
# Плотные (векторные) эмбеддинги для гибридного поиска. ONNX, без torch.
rag = ["fastembed>=0.7.0"]
# Распознавание речи (GigaAM v3 в ONNX + Vosk для wake word) и синтез.
voice = [
    "onnx-asr[cpu,hub]>=0.12.0",
    "vosk>=0.3.45",
    "av>=13.0.0",
    "edge-tts>=7.0.0",
]

[project.scripts]
rudik-scrape = "backend.scraper.cli:main"
rudik-index = "backend.rag.build:main"
rudik-serve = "backend.__main__:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
